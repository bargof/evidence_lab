[tool.poetry]
name = "evidence-lab"
version = "0.1.0"
description = "EvidenceLab: razonamiento probatorio trazable sobre resoluciones judiciales mexicanas"
authors = ["Bargof"]
readme = "README.md"
packages = [{ include = "evidence_lab", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
numpy = ">=1.26,<3.0"
pandas = ">=2.2"
pydantic = ">=2.13.1,<3.0"
pydantic-settings = ">=2.13.1,<3.0"
python-dotenv = ">=1.2.2"
sentence-transformers = ">=5.0"
rank-bm25 = ">=0.2.2"
ollama = ">=0.6"
gradio = ">=5.0"
scikit-learn = ">=1.5"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.5"
pre-commit = ">=3.5"
ipykernel = ">=6.0"
dvc = ">=3.60"
jupyter = ">=1.1"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --cov=src/evidence_lab --cov-report=term-missing"
