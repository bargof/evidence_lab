rules:
  - id: RULE-TEMP-TRANSITIVE
    if: [A BEFORE B, B BEFORE C]
    then: A BEFORE C
  - id: RULE-OPPORTUNITY-NOT-GUILT
    if: [PERSON WAS_PRESENT, INCIDENT OCCURRED]
    forbidden: PERSON IS_GUILTY
  - id: RULE-TESTIMONY-NOT-FACT
    if: [SOURCE TESTIFIES X]
    then: X IS_CLAIMED
    forbidden: X IS_PROVEN
  - id: RULE-OFFICIAL-OUTCOME
    if: [FINAL_COURT OFFICIALLY_FINDS X]
    then: X MAY_BE_REPORTED_AS_OFFICIAL_OUTCOME
  - id: RULE-ABSENCE-NOT-NEGATION
    if: [NO_EVIDENCE_OF X]
    forbidden: NOT X
